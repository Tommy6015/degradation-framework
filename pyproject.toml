[project]
name = "degradation-fw"
version = "0.1.0"
description = "Image degradation framework (fog, lens dirt, water drops, ...) with a point-and-click GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
    # used by third_party/camera_contamination_simulation
    "torch==2.11.*",           # CUDA build, see [tool.uv.sources] below
    "opencv-python>=4.10",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

# torch from the official CUDA 12.8 wheel index (GPU build), not the CPU build on PyPI
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
# GUI is postponed until the core degradations work. Install with: uv sync --extra gui
gui = ["gradio>=4.0"]

[project.scripts]
degfw = "degradation_fw.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["degradation_fw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
