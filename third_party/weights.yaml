# Model weights used by the code in third_party/. One entry per file.
#
#   path    where the third-party code expects the file, relative to third_party/
#   size    in bytes; with sha256 checked by `degfw weights --verify` and after a download
#   url     where `degfw weights --download` gets it; no url = the file is in git
#
# Adapters refer to an entry by its id:  requires_weights = ("depth_pro",)
# State of all files:                    uv run degfw weights

