# Example pipeline. Steps are applied top to bottom.
# Run:  uv run degfw apply -c configs/example.yaml -i data/input -o outputs/example
seed: 0
steps:
  - name: fog
    params:
      visibility: 100     # metres, lower = denser fog
      fp16: true          # ~20x faster on an 8 GB GPU, at most 2/255 different from float32
      lidar: ""           # optional: folder with TUMTraf label files and point clouds
